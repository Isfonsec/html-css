<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightcoral;
            flex-flow: row wrap;
            height: 200px;

        }

        div.item {
            border: 1px solid black;
            background-color: lightskyblue;
            text-align: center;
            padding: 20px;
        }

        div#i1 {
            align-self: auto;
        }
        div#i2 {
            align-self: start;
        }
        div#i3 {
            align-self: end;
        }
        div#i4 {
            align-self: center;
        }
        div#i5 {
            align-self: stretch;
        }
        div#i6 {
            align-self: auto;
        }
        div#i7 {
            align-self: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
